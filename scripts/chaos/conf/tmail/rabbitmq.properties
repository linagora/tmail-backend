# chaos: a 3 node cluster, quorum queues replicated on the 3 of them
# heartbeat=5: amqp-client (5.37, ConnectionFactory.setUri) reads it from the URI and requests it (setRequestedHeartbeat;
# its default: 60 s); a frozen broker is declared dead in ~2 heartbeats and the connection recovers on another of the
# hosts. James has no key of its own for it, nor for the channel RPC and connection timeouts (60 s, code only)
uri=amqp://rabbitmq1:5672?heartbeat=5
hosts=rabbitmq1:5672,rabbitmq2:5672,rabbitmq3:5672
management.uri=http://rabbitmq1:15672
management.user=guest
management.password=guest
quorum.queues.enable=true
quorum.queues.replication.factor=3
# no Cassandra view (projection) of the mail queue: its initialisation (LWT inserts, CassandraMailQueueView.initialize)
# made tmail's start fail on a CAS quorum error with a healthy cluster; James documents it as a performance option
cassandra.view.enabled=false
mailqueue.view.sliceWindow=1h
mailqueue.view.bucketCount=1
mailqueue.view.updateBrowseStartPace=1000
mailqueue.size.metricsEnabled=false
task.consumption.enabled=true
# the channel pool: a borrow waits max.delay.ms, retried with a backoff (defaults: 5 s, 3 retries: 30-45 s on a frozen
# node); 1 s and 1 retry: a publish that cannot get a channel fails in ~3 s
channel.pool.max.delay.ms=1000
channel.pool.retries=1
address.contact.uri=amqp://rabbitmq1:5672
address.contact.user=guest
address.contact.password=guest
address.contact.queue=AddressContactQueue1
