# chaos: 3 nodes, one replica of each shard: one node down leaves a copy of every shard
opensearch.hosts=opensearch1:9200,opensearch2:9200,opensearch3:9200
opensearch.nb.shards=3
opensearch.nb.replica=1
opensearch.index.waitForActiveShards=1
opensearch.retryConnection.maxRetries=7
opensearch.retryConnection.minDelay=3000
opensearch.indexAttachments=false
# 3 s instead of 30: James applies it to connect, connection-request and socket timeouts. On any failure (a timeout
# included) the client (opensearch-rest-client 2.19.2, RestClient.performRequestAsync) marks the node dead and retries
# the request on the next node: a frozen node costs 3 s once, then is skipped, for searches and indexing alike
opensearch.request.timeout=3s
