# chaos: Basic and OIDC (LemonLDAP, introspection of the bearer tokens; the users in LDAP)
enabled=true
tls.keystoreURL=file://conf/keystore
tls.secret=james72laBalle
jwt.publickeypem.url=file://conf/jwt_publickey
jwt.privatekeypem.url=file://conf/jwt_privatekey
# no JWTAuthenticationStrategy: LemonLDAP's access tokens are JWTs it rejects before OIDC is tried (as the demo)
authentication.strategy.rfc8621=BasicAuthenticationStrategy,com.linagora.tmail.james.jmap.ticket.TicketAuthenticationStrategy,com.linagora.tmail.james.jmap.oidc.OidcAuthenticationStrategy
view.email.query.enabled=true
url.prefix=http://tmail:80
websocket.url.prefix=ws://tmail:80
dynamic.jmap.prefix.resolution.enabled=true
oidc.provider.url=http://sso.example.com
oidc.introspect.url=http://sso.example.com/oauth2/introspect
oidc.introspect.credentials=Basic amFtZXM6amFtZXM=
oidc.audience=james
oidc.userInfo.url=http://sso.example.com/oauth2/userinfo
oidc.claim=email
