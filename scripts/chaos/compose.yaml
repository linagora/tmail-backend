# The chaos stack of Twake Mail: 1 tmail, 3 Cassandra, 3 OpenSearch, 3 RabbitMQ, 3 Redis (cluster), 1 S3, 1 Rspamd (and its own
# Redis), 1 LemonLDAP (SSO), 1 OpenLDAP. Each container has a memory limit (the whole: ~12 GB). Every node of a replicated
# component is its own service (cassandra1..3...): twake-chaos pauses, stops and restarts them one by one (topology.yaml).
# Published on 127.0.0.1 only: what the control scripts reach (JMAP, WebAdmin, SMTP, IMAP, the SSO portal).

x-cassandra: &cassandra
  image: cassandra:4.1.9
  mem_limit: 1536m
  environment: &cassandra-env
    CASSANDRA_CLUSTER_NAME: chaos
    CASSANDRA_SEEDS: cassandra1,cassandra2
    CASSANDRA_DC: datacenter1  # the local DC of tmail's cassandra-driver.conf
    CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
    MAX_HEAP_SIZE: 768M
    HEAP_NEWSIZE: 128M
    JVM_OPTS: -Dcassandra.skip_wait_for_gossip_to_settle=0 -Dcassandra.consistent.rangemovement=false -Dcassandra.ring_delay_ms=5000
  healthcheck:
    test: ["CMD-SHELL", "nodetool status 2>/dev/null | grep -q \"^UN *$$(hostname -i | cut -d' ' -f1) \" && cqlsh -e 'describe keyspaces' >/dev/null"]
    interval: 5s
    timeout: 30s
    retries: 120
    start_period: 30s

x-opensearch: &opensearch
  image: opensearchproject/opensearch:2.19.2
  mem_limit: 1280m
  ulimits:
    nofile: {soft: 65536, hard: 65536}
  environment: &opensearch-env
    cluster.name: chaos
    discovery.seed_hosts: opensearch1,opensearch2,opensearch3
    cluster.initial_cluster_manager_nodes: opensearch1,opensearch2,opensearch3
    DISABLE_INSTALL_DEMO_CONFIG: "true"
    DISABLE_SECURITY_PLUGIN: "true"
    OPENSEARCH_JAVA_OPTS: -Xms640m -Xmx640m

x-rabbitmq: &rabbitmq
  image: rabbitmq:4.0.9-management
  mem_limit: 512m
  environment:
    RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: -setcookie twake-chaos-cookie
    RABBITMQ_CTL_ERL_ARGS: -setcookie twake-chaos-cookie
  volumes:
    - ./conf/rabbitmq/20-chaos.conf:/etc/rabbitmq/conf.d/20-chaos.conf:ro
  healthcheck:
    test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
    interval: 5s
    timeout: 20s
    retries: 60

x-redis: &redis
  image: redis:8.0.2
  mem_limit: 256m
  entrypoint: ["/node.sh"]
  volumes:
    - ./conf/redis/node.sh:/node.sh:ro
  healthcheck:
    test: ["CMD-SHELL", "redis-cli -p 6379 ping && redis-cli -p 6380 ping"]
    interval: 5s
    timeout: 5s
    retries: 30

services:
  tmail:
    image: ${TMAIL_IMAGE:?}
    hostname: tmail
    mem_limit: 2g
    environment:
      JAVA_TOOL_OPTIONS: -Xms512m -Xmx1280m
    volumes:
      - ${CHAOS_RUN:?}/jwt_publickey:/root/conf/jwt_publickey:ro
      - ${CHAOS_RUN:?}/jwt_privatekey:/root/conf/jwt_privatekey:ro
      - ./conf/tmail/cassandra.properties:/root/conf/cassandra.properties:ro
      - ./conf/tmail/opensearch.properties:/root/conf/opensearch.properties:ro
      - ./conf/tmail/rabbitmq.properties:/root/conf/rabbitmq.properties:ro
      - ./conf/tmail/redis.properties:/root/conf/redis.properties:ro
      - ./conf/tmail/rspamd.properties:/root/conf/rspamd.properties:ro
      - ./conf/tmail/tika.properties:/root/conf/tika.properties:ro
      - ./conf/tmail/domainlist.xml:/root/conf/domainlist.xml:ro
      - ./conf/tmail/jmap.properties:/root/conf/jmap.properties:ro
      - ./conf/tmail/usersrepository.xml:/root/conf/usersrepository.xml:ro
      - ./conf/tmail/mailetcontainer.xml:/root/conf/mailetcontainer.xml:ro
    ports:
      - "127.0.0.1:${CHAOS_JMAP_PORT:?}:80"
      - "127.0.0.1:${CHAOS_WEBADMIN_PORT:?}:8000"
      - "127.0.0.1:${CHAOS_SMTP_PORT:?}:25"
      - "127.0.0.1:${CHAOS_SUBMISSION_PORT:?}:587"
      - "127.0.0.1:${CHAOS_IMAP_PORT:?}:143"
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s -o /dev/null 'http://localhost:8000/healthcheck?check=IMAPHealthCheck'"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 60s

  cassandra1:
    <<: *cassandra
    hostname: cassandra1
  cassandra2:
    <<: *cassandra
    hostname: cassandra2
    depends_on: {cassandra1: {condition: service_healthy}}
  cassandra3:
    <<: *cassandra
    hostname: cassandra3
    depends_on: {cassandra2: {condition: service_healthy}}

  opensearch1:
    <<: *opensearch
    hostname: opensearch1
    environment: {<<: *opensearch-env, node.name: opensearch1}
  opensearch2:
    <<: *opensearch
    hostname: opensearch2
    environment: {<<: *opensearch-env, node.name: opensearch2}
  opensearch3:
    <<: *opensearch
    hostname: opensearch3
    environment: {<<: *opensearch-env, node.name: opensearch3}

  rabbitmq1:
    <<: *rabbitmq
    hostname: rabbitmq1
  rabbitmq2:
    <<: *rabbitmq
    hostname: rabbitmq2
  rabbitmq3:
    <<: *rabbitmq
    hostname: rabbitmq3

  redis1:
    <<: *redis
    hostname: redis1
  redis2:
    <<: *redis
    hostname: redis2
  redis3:
    <<: *redis
    hostname: redis3

  s3:
    image: ghcr.io/scality/cloudserver:c1ba296859690c1cbbec609aaae430f6b04b4745
    mem_limit: 768m
    environment:
      SCALITY_ACCESS_KEY_ID: accessKey1
      SCALITY_SECRET_ACCESS_KEY: secretKey1
      S3BACKEND: mem
      REMOTE_MANAGEMENT_DISABLE: "1"
    networks:
      default:
        aliases: [s3.docker.test]

  rspamd:
    image: rspamd/rspamd:3.14.3
    mem_limit: 512m
    environment:
      PASSWORD: admin
      REDIS_SERVERS: rspamd-redis:6379
    volumes:
      - ./conf/rspamd/actions.conf:/etc/rspamd/local.d/actions.conf:ro
      - ./conf/rspamd/redis.conf:/etc/rspamd/local.d/redis.conf:ro
      - ./conf/rspamd/statistic.conf:/etc/rspamd/local.d/statistic.conf:ro
      - ./conf/rspamd/worker-controller.inc:/etc/rspamd/local.d/worker-controller.inc:ro
    depends_on: [rspamd-redis]

  # Rspamd's own Redis (Bayes): standalone, not part of tmail's cluster
  rspamd-redis:
    image: redis:8.0.2
    mem_limit: 128m

  ldap:
    image: osixia/openldap:1.5.0
    hostname: ldap
    mem_limit: 256m
    # --copy-service: the bootstrap LDIFs are copied before osixia rewrites them in place
    command: --copy-service
    environment:
      LDAP_ORGANISATION: Twake Mail chaos
      LDAP_DOMAIN: tmail.com
      LDAP_ADMIN_PASSWORD: admin
      LDAP_CONFIG_PASSWORD: admin
      LDAP_RFC2307BIS_SCHEMA: "true"
      LDAP_TLS: "false"
    volumes:
      - ./conf/ldap:/container/service/slapd/assets/config/bootstrap/ldif/custom:ro

  sso:
    image: yadd/lemonldap-ng-full
    mem_limit: 384m
    environment:
      SSODOMAIN: example.com
      PORTAL: http://sso.example.com
      LOGLEVEL: info
      LOGGER: stderr
      USERLOGGER: stderr
    volumes:
      - ./conf/lemonldap/lmConf-1.json:/var/lib/lemonldap-ng/conf/lmConf-1.json:ro
    ports:
      - "127.0.0.1:${CHAOS_SSO_PORT:?}:80"
    networks:
      default:
        aliases: [sso.example.com]
