# Configuration file for OpenSearch, the QA environment's: the one of the distributed app plus what is set below.
# Read https://james.apache.org/server/config-opensearch.html for further details
opensearch.masterHost=opensearch
opensearch.port=9200

# One node, one replica per index as in production: the replica of a shard cannot be placed on the same node, so it stays
# unassigned and takes no disk here (a footprint measured on this stack is the primaries'; production keeps two copies).
opensearch.nb.replica=1

# The headers of a mail are not indexed. Every header is a nested document of its own (postings, norms and doc values) and kept
# again in _source: mailbox_v1 is 475 MB for 200 mailboxes of 200 mails (twake-footprint, 97% of OpenSearch's footprint). What
# the headers account for there is not measured (an estimate of 5 to 10% on this provisioning, more on real inbound mail with
# its Received and DKIM headers): measure again with ./twake-footprint --repo tmail-backend --provision. The addresses, the
# subject and the dates keep their own fields, which the JMAP and IMAP searches of the clients read; only the `header` filter on
# other headers needs the nested ones.
opensearch.indexHeaders=false
