version: "2.7"

networks:
  emaily:
    driver: bridge

services:
  openpaas:
    # Twake Calendar side service, which serves the OpenPaaS REST API ESN used to serve
    hostname: esn
    # The configuration is built into the image rather than bind mounted: when run from the test-jar, this directory is
    # extracted under the temporary directory of the test JVM, that the Docker daemon of the CI cannot see. The build
    # context is uploaded through the Docker API instead.
    build:
      context: ./side-service-conf
      dockerfile_inline: |
        FROM linagora/twake-calendar-side-service:2.5.0.9
        COPY . /root/conf
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - emaily

  redis:
    image: redis:8.12.0
    networks:
      - emaily
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 30

  rabbitmq:
    image: rabbitmq:4.2.9-management
    hostname: esn-rabbit
    networks:
      - emaily
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 30s
      retries: 3

  mongo:
    image: mongo
    networks:
      - emaily
    command: ["mongod", "--bind_ip", "0.0.0.0"]
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "'quit(db.runCommand({ ping: 1 }).ok ? 0 : 2)'",
        ]
      start_period: 40s
      interval: 10s
      timeout: 10s
      retries: 10

  sabre_dav:
    hostname: esn_sabre
    # Built with the public key rather than bind mounted, see the openpaas service
    build:
      context: ./side-service-conf
      dockerfile_inline: |
        FROM linagora/esn-sabre:2.5.0.9
        COPY jwt_publickey /var/www/config/esn.key.pub
    environment:
      - SABRE_ENV=dev
      - SABRE_MONGO_HOST=mongo
      - SABRE_MONGO_PORT=27017
      - ESN_MONGO_HOST=mongo
      - ESN_MONGO_PORT=27017
      - ESN_MONGO_DBNAME=esn_docker
      - MONGO_TIMEOUT=100000
      - ESN_HOST=esn
      - ESN_PORT=8080
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - AMQP_HOST=rabbitmq
      - AMQP_PORT=5672
      - SABRE_ADMIN_LOGIN=admin
      - SABRE_ADMIN_PASSWORD=secret123
      - OPENPASS_BASIC_AUTH=YWRtaW5Ab3Blbi1wYWFzLm9yZzpzZWNyZXQ=
      - SABRE_IMPERSONATION_ENABLED=true
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - emaily
    healthcheck:
      test: [ "CMD", "curl", "-f", "-u", "admin&admin@open-paas.org:secret123", "http://esn_sabre:80","-X", "PROPFIND" ]
      start_period: 40s
      interval: 10s
      timeout: 10s
      retries: 10
