version: "3"

networks:
  emaily:
    driver: bridge

services:
  openpaas:
    # Twake Calendar side service, which serves the OpenPaaS REST API ESN used to serve
    container_name: esn
    hostname: esn
    image: linagora/twake-calendar-side-service:2.5.0.9
    ports:
      - "8080:8080"
    volumes:
      - ./src/test/resources/docker-openpaas-setup/side-service-conf:/root/conf
    depends_on:
      - mongo
      - redis
      - rabbitmq
    networks:
      - emaily

  redis:
    container_name: esn_redis
    image: redis:8.12.0
    ports:
      - "6379:6379"
    networks:
      - emaily

  rabbitmq:
    container_name: esn_rabbitmq
    image: rabbitmq:4.2.9-management
    hostname: esn-rabbit
    ports:
      - 5672:5672
      - 15672:15672
    networks:
      - emaily

  mongo:
    container_name: esn_mongo
    image: mongo
    ports:
      - "27017:27017"
    networks:
      - emaily

  sabre_dav:
    container_name: esn_sabre
    image: linagora/esn-sabre:2.5.0.9
    ports:
      - "8001:80"
    environment:
      - SABRE_ENV=dev
      - SABRE_MONGO_HOST=mongo
      - SABRE_MONGO_PORT=27017
      - ESN_MONGO_HOST=mongo
      - ESN_MONGO_PORT=27017
      - ESN_MONGO_DBNAME=esn_docker
      - MONGO_TIMEOUT=100000
      - ESN_HOST=esn
      - ESN_PORT=8080
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - AMQP_HOST=rabbitmq
      - AMQP_PORT=5672
      - SABRE_ADMIN_LOGIN=admin
      - SABRE_ADMIN_PASSWORD=secret123
      - OPENPASS_BASIC_AUTH=YWRtaW5Ab3Blbi1wYWFzLm9yZzpzZWNyZXQ=
      - SABRE_IMPERSONATION_ENABLED=true
    volumes:
      - ./src/test/resources/docker-openpaas-setup/side-service-conf/jwt_publickey:/var/www/config/esn.key.pub
    networks:
      - emaily

  tmail-backend:
    image: linagora/tmail-backend-memory:latest
    container_name: tmail-backend
    hostname: tmail-backend.local
    ports:
      - "8000:8000"
      - "25:25"
      - "465:465"
      - "587:587"
      - "143:143"
      - "993:993"
    environment:
      - DOMAIN=open-paas.org
    volumes:
      - ./sample_conf/jwt_publickey:/root/conf/jwt_publickey # Replace with absolute path to your RSA public key
      - ./sample_conf/jwt_privatekey:/root/conf/jwt_privatekey # Replace with absolute path to your RSA private key
      - ./sample_conf/mailetcontainer.xml:/root/conf/mailetcontainer.xml
      - ./sample_conf/openpaas.properties:/root/conf/openpaas.properties
    networks:
      - emaily

  tmail-provision-sample-data:
    image: curlimages/curl:latest
    container_name: create-users
    depends_on:
      - tmail-backend
      - openpaas
    volumes:
      - ./script_create_sample_data_for_docker_compose.sh:/usr/local/bin/provision.sh
    entrypoint: ["sh", "/usr/local/bin/provision.sh"]
    networks:
      - emaily
