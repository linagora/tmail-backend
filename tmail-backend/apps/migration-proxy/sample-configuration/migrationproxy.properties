# IMAP backends the proxy relays authenticated connections to (old / new). The SMTP old/new/external
# routing lives in mailetcontainer.xml instead. Keys: imap.<target>.{host,port,ssl,
# ssl.ignoreCertificates,forwardProxyInfo}.
imap.old.host=${sys:migration.imap.old.host:-old-backend}
imap.old.port=${sys:migration.imap.old.port:-143}
imap.old.ssl=false
imap.old.ssl.ignoreCertificates=false
imap.old.forwardProxyInfo=false
imap.new.host=${sys:migration.imap.new.host:-new-backend}
imap.new.port=${sys:migration.imap.new.port:-143}
imap.new.ssl=false
imap.new.ssl.ignoreCertificates=false
imap.new.forwardProxyInfo=false

# Optional. How long the proxy waits while connecting to and replaying the authentication against a
# backend before failing a LOGIN. Defaults to 30s.
imap.handshakeTimeout=30s

# Optional Kerberos support. When enabled the proxy authenticates its IMAP clients with GSSAPI, LOGIN is
# disabled (the proxy advertises LOGINDISABLED AUTH=GSSAPI) and, having no user password to replay, it
# opens the backend session by SASL PLAIN delegation as the administrators configured below.
# 'requireSSL' (default true) only offers GSSAPI over an encrypted transport, which requires socketTLS or
# startTLS to be enabled in imapserver.xml.
kerberos.enabled=false
#kerberos.serviceName=imap
#kerberos.serverName=imap.domain.com
#kerberos.principal=imap/imap.domain.com@DOMAIN.COM
#kerberos.keyTab=/root/conf/imap.keytab
#kerberos.requireSSL=true

# Backend administrators the proxy delegates user sessions to. Required when kerberos.enabled is true.
#imap.old.admin.username=old-admin@domain.com
#imap.old.admin.password=old-password
#imap.new.admin.username=new-admin@domain.com
#imap.new.admin.password=new-password
