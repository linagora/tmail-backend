# IMAP backends the proxy relays authenticated connections to (old / new). The SMTP old/new/external
# routing lives in mailetcontainer.xml instead. Keys: imap.<target>.{host,port,ssl,
# ssl.ignoreCertificates,forwardProxyInfo}.
imap.old.host=${sys:migration.imap.old.host:-old-backend}
imap.old.port=${sys:migration.imap.old.port:-143}
imap.old.ssl=${sys:migration.imap.old.ssl:-false}
imap.old.ssl.ignoreCertificates=${sys:migration.imap.old.ssl.ignoreCertificates:-false}
imap.old.forwardProxyInfo=false
imap.new.host=${sys:migration.imap.new.host:-new-backend}
imap.new.port=${sys:migration.imap.new.port:-143}
imap.new.ssl=${sys:migration.imap.new.ssl:-false}
imap.new.ssl.ignoreCertificates=${sys:migration.imap.new.ssl.ignoreCertificates:-false}
imap.new.forwardProxyInfo=false

# Kerberos is off unless a test turns it on (MigrationGssapiTest, driven by the embedded KDC).
kerberos.enabled=${sys:migration.kerberos.enabled:-false}
kerberos.enforceVerifiedBackendTLS=${sys:migration.kerberos.enforceVerifiedBackendTLS:-true}
kerberos.serviceName=${sys:migration.kerberos.serviceName:-imap}
kerberos.serverName=${sys:migration.kerberos.serverName:-localhost}
kerberos.principal=${sys:migration.kerberos.principal:-}
kerberos.keyTab=${sys:migration.kerberos.keyTab:-}
kerberos.requireSSL=${sys:migration.kerberos.requireSSL:-true}
# JAMES.TEST is the realm of the embedded KDC. Unset - hence ignored - unless
# MigrationGssapiRealmMappingTest maps it onto a mail domain of its own.
kerberos.realmMapping.JAMES.TEST=${sys:migration.kerberos.realmMapping:-}
imap.old.admin.username=${sys:migration.imap.old.admin.username:-}
imap.old.admin.password=${sys:migration.imap.old.admin.password:-}
imap.new.admin.username=${sys:migration.imap.new.admin.username:-}
imap.new.admin.password=${sys:migration.imap.new.admin.password:-}

# SMTP submission proxy: off unless a test turns it on (SubmissionProxyTest & co).
submission.enabled=${sys:migration.submission.enabled:-false}
submission.old.host=${sys:migration.submission.old.host:-old-backend}
submission.old.port=${sys:migration.submission.old.port:-587}
submission.old.ssl=${sys:migration.submission.old.ssl:-false}
submission.old.ssl.ignoreCertificates=${sys:migration.submission.old.ssl.ignoreCertificates:-false}
submission.old.forwardProxyInfo=${sys:migration.submission.old.forwardProxyInfo:-false}
submission.new.host=${sys:migration.submission.new.host:-new-backend}
submission.new.port=${sys:migration.submission.new.port:-587}
submission.new.ssl=${sys:migration.submission.new.ssl:-false}
submission.new.ssl.ignoreCertificates=${sys:migration.submission.new.ssl.ignoreCertificates:-false}
submission.handshakeTimeout=${sys:migration.submission.handshakeTimeout:-30s}
submission.auth.requireSSL=${sys:migration.submission.auth.requireSSL:-false}
submission.ehlo.extensions=${sys:migration.submission.ehlo.extensions:-}
