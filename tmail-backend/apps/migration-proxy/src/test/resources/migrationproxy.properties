# IMAP backends the proxy relays authenticated connections to (old / new). The SMTP old/new/external
# routing lives in mailetcontainer.xml instead. Keys: imap.<target>.{host,port,ssl,
# ssl.ignoreCertificates,forwardProxyInfo}.
imap.old.host=${sys:migration.imap.old.host:-old-backend}
imap.old.port=${sys:migration.imap.old.port:-143}
imap.old.ssl=false
imap.old.ssl.ignoreCertificates=false
imap.old.forwardProxyInfo=false
imap.new.host=${sys:migration.imap.new.host:-new-backend}
imap.new.port=${sys:migration.imap.new.port:-143}
imap.new.ssl=false
imap.new.ssl.ignoreCertificates=false
imap.new.forwardProxyInfo=false

# Kerberos is off unless a test turns it on (MigrationGssapiTest, driven by the embedded KDC).
kerberos.enabled=${sys:migration.kerberos.enabled:-false}
kerberos.serviceName=${sys:migration.kerberos.serviceName:-imap}
kerberos.serverName=${sys:migration.kerberos.serverName:-localhost}
kerberos.principal=${sys:migration.kerberos.principal:-}
kerberos.keyTab=${sys:migration.kerberos.keyTab:-}
kerberos.requireSSL=${sys:migration.kerberos.requireSSL:-true}
imap.old.admin.username=${sys:migration.imap.old.admin.username:-}
imap.old.admin.password=${sys:migration.imap.old.admin.password:-}
imap.new.admin.username=${sys:migration.imap.new.admin.username:-}
imap.new.admin.password=${sys:migration.imap.new.admin.password:-}
