# Configuration file for cassandra mailbox
# Read https://james.apache.org/server/config-cassandra.html for further details

cassandra.nodes=cassandra
# Name of the local datacenter. Required for LOCAL_* consistency levels to be meaningful on multi-DC clusters.
#cassandra.local.dc=datacenter1
cassandra.keyspace.create=true
cassandra.keyspace=apache_james
# Defaults to the main keyspace name suffixed with _cache
#cassandra.keyspace.cache=apache_james_cache
#cassandra.user=cassandra
#cassandra.password=cassandra
#cassandra.ssl=false
cassandra.replication.factor=1
cassandra.retryConnection.maxRetries=200
cassandra.retryConnection.minDelay=5000

# Read com.datastax.driver.core.PoolingOptions for knowing defaults value
# No value here will default to driver's default value

# cassandra.pooling.local.max.connections=8
# cassandra.pooling.local.max.requests=128
## In ms. Should be higher than socket read timeout
# cassandra.pooling.timeout=5000
## In seconds.
# cassandra.pooling.heartbeat.timeout=30
# cassandra.pooling.max.queue.size=256

## These low level tuning options controls performance related options in Cassandra related code
## Values below are the ones Twake Mail runs in production. James defaults are given in comments.
## Understand the effects before editing.

## Retries upon LWT contention. Low values fail fast rather than piling up retries under contention.
# James defaults: 1000, 1000, 100000, 1000, 100000
mailbox.max.retry.message.flags.update=16
mailbox.max.retry.message.id.flags.update=16
mailbox.max.retry.modseq=16
mailbox.max.retry.acl=16
mailbox.max.retry.uid=16

## Read repairs are disabled: they significantly increase load for little benefit.
# James defaults: 0.1, 0.1, 0.01
## Formula: read_repair_chance = min(mailbox.counters.read.repair.chance.max, (100/unseens)*mailbox.counters.read.repair.chance.one.hundred)
mailbox.read.repair.chance=0.00
mailbox.counters.read.repair.chance.max=0.000
mailbox.counters.read.repair.chance.one.hundred=0.000

## Strong consistency relies on QUORUM / SERIAL reads. Disabling it trades consistency for latency and availability.
# James defaults: true
mailbox.read.strong.consistency=false
message.read.strong.consistency=false
message.write.strong.consistency.unsafe=false
uid.read.strong.consistency.unsafe=false
modseq.read.strong.consistency.unsafe=false
mailrepository.strong.consistency=false

## Try reads at LOCAL_ONE first, falling back to the regular consistency level when nothing is found.
# James default: false
optimistic.consistency.level.enabled=true

# acl.enabled=true
## none or enabled
# mailbox.blob.recovery.mode=none

# fetch.advance.row.count=1000
# chunk.size.message.read=100
# chunk.size.expunge=100
# mailbox.blob.part.size=102400

## JMAP change history is only useful to clients catching up on `/changes`: it can safely expire.
# email.change.ttl=60 days
# mailbox.change.ttl=60 days

## Consistency levels used for common queries
## Read https://docs.datastax.com/en/cassandra-oss/3.x/cassandra/dml/dmlConfigConsistency.html
# QUORUM, LOCAL_QUORUM, or EACH_QUORUM
# cassandra.consistency_level.regular=QUORUM
# SERIAL or LOCAL_SERIAL
# cassandra.consistency_level.lightweight_transaction=SERIAL
