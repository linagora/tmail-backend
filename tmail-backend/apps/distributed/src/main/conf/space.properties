# Twake Space: gives each TwakeSpace space a team mailbox, and reports its mail to the space feed.
# This configuration file is optional. Read docs/modules/ROOT/pages/tmail-backend/configure/twake-space.adoc.

# Loads the extension. Defaults to false.
enabled=false

# RabbitMQ server holding the exchanges below. Defaults to the one of rabbitmq.properties.
#rabbitmq.uri=amqp://user:password@rabbitmq:5672/twake

#space.exchange=space
#dns.exchange=admin-panel
#dns.routingKey=dns.validated
#activity.exchange=activity

#queue=tmail-space
#deadLetterQueue=tmail-space-dead-letter

# Put before the name of each team mailbox, like space- for space-sales@acme.com. Applies to new spaces only.
#teamMailbox.prefix=

# How long the team mailbox of a deleted space is kept before being deleted, and how often this is checked.
#retention=30d
#purge.interval=1h

# Team mailbox received and sent events (formerly TeamMailboxEventsListener in listeners.xml). Defaults to false.
#teamMailboxEvents.enabled=false
#teamMailboxEvents.exchange=tmail
#teamMailboxEvents.receivedRoutingKey=team-mailbox.message.received
#teamMailboxEvents.sentRoutingKey=team-mailbox.message.sent
