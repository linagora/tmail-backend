

services:
  tmail-frontend:
    image: linagora/tmail-web:master
    container_name: tmail-frontend
    ports:
      - "8080:80"
    volumes:
      - ./tmail/.env:/usr/share/nginx/html/assets/env.file
      - ./tmail/app_dashboard.json:/usr/share/nginx/html/assets/configurations/app_dashboard.json
      - ./tmail/icon/lemonldap-ng-logo.png:/usr/share/nginx/html/assets/configurations/icons/lemonldap-ng-logo.png
    depends_on:
      - tmail-backend
    networks:
      - tmail

  tmail-backend:
    image: linagora/tmail-backend:memory-branch-master
    container_name: tmail-backend
    ports:
      - "8000:8000"
      - "8001:80"
    environment:
      - DOMAIN=tmail.com
    volumes:
      - ./tmail/jwt_publickey:/root/conf/jwt_publickey
      - ./tmail/jwt_privatekey:/root/conf/jwt_privatekey
      - ./tmail/jmap.properties:/root/conf/jmap.properties
      - ./tmail/usersrepository.xml:/root/conf/usersrepository.xml
      - ./tmail/mailetcontainer.xml:/root/conf/mailetcontainer.xml
      - ./tmail/domainlist.xml:/root/conf/domainlist.xml
      - ./tmail/smtpserver.xml:/root/conf/smtpserver.xml
      - ./tmail/listeners.xml:/root/conf/listeners.xml
      - ./tmail/extensions-jars/tmail-ai-bot-jar-with-dependencies.jar:/root/libs/tmail-ai-bot-jar-with-dependencies.jar
      - ./tmail/ai.properties:/root/conf/ai.properties
      - ./tmail/extensions.properties:/root/conf/extensions.properties
    networks:
      - tmail
    restart: on-failure

  sso.example.com:
    image: yadd/lemonldap-ng-full
    container_name: sso.example.com
    ports:
      - "80:80"
    volumes:
      - "./lemonldap/lmConf-1.json:/var/lib/lemonldap-ng/conf/lmConf-1.json"
    environment:
      - SSODOMAIN=example.com
      - PORTAL=http://sso.example.com
      - LOGLEVEL=debug
      - LOGGER=stderr
      - USERLOGGER=stderr
    depends_on:
      - ldap
    networks:
      - tmail

  ldap:
    container_name: ldap
    image: osixia/openldap:1.5.0
    # --copy-service: the bootstrap LDIFs are copied before osixia rewrites them in place
    command: --copy-service
    ports:
      - "389:389"
    volumes:
      - "./ldap/bootstrap:/container/service/slapd/assets/config/bootstrap/ldif/custom:ro"
    environment:
      - LDAP_ORGANISATION=Twake Mail demo
      - LDAP_DOMAIN=tmail.com
      - LDAP_ADMIN_PASSWORD=admin
      - LDAP_CONFIG_PASSWORD=admin
      - LDAP_RFC2307BIS_SCHEMA=true
      - LDAP_TLS=false
    networks:
      - tmail

  # Twake Directory Manager: ldap-rest and its administration console. Every change made
  # through it is pushed to Twake Mail by the core/twake/james plugin over WebAdmin.
  directory.example.com:
    image: ghcr.io/linagora/twake-directory-manager:0.5.0
    container_name: directory-manager
    ports:
      - "8081:8081"
    environment:
      - DM_LDAP_URL=ldap://ldap:389
      - DM_LDAP_DN=cn=admin,dc=tmail,dc=com
      - DM_LDAP_PWD=admin
      - DM_LDAP_BASE=dc=tmail,dc=com
      - DM_LDAP_TOP_ORGANIZATION=ou=organization,dc=tmail,dc=com
      - DM_LDAP_GROUP_BASE=ou=groups,dc=tmail,dc=com
      - DM_OIDC_SERVER=http://sso.example.com
      - DM_OIDC_CLIENT_ID=twake-directory-manager
      - DM_OIDC_CLIENT_SECRET=demo-directory-manager-secret-0123456789
      - DM_BASE_URL=http://directory.example.com:8081
      - DM_EXTRA_PLUGINS=core/twake/james
      - DM_JAMES_WEBADMIN_URL=http://tmail-backend:8000
    depends_on:
      - ldap
      - sso.example.com
      - tmail-backend
    networks:
      - tmail
    restart: on-failure

  # Front of James WebAdmin for the admin SPAs: checks their LemonLDAP tokens and applies the
  # per-client profile of webadmin-proxy/configuration.json.
  webadmin-proxy:
    image: linagora/webadmin-proxy:1.1.6
    container_name: webadmin-proxy
    ports:
      - "8002:8001"
    volumes:
      - ./webadmin-proxy/configuration.json:/root/conf/configuration.json:ro
    depends_on:
      - sso.example.com
      - tmail-backend
    networks:
      - tmail
    restart: on-failure

  # Twake Mail Admin, technical console (global mode), for admin@tmail.com.
  # SSO_ALLOW_INSECURE_REQUESTS (http LemonLDAP) is not released yet: build the image from the
  # sso-allow-insecure-requests branch of twake-mail-admin, see README.md.
  twake-mail-admin:
    image: twake-mail-admin:local
    pull_policy: never
    container_name: twake-mail-admin
    ports:
      - "3333:80"
    volumes:
      - ./twake-mail-admin/admin.env.js:/usr/share/nginx/html/env.js:ro
    networks:
      - tmail

  # Twake Mail Admin, functional console (domain mode, tmail.com), for support@tmail.com.
  twake-mail-functional-admin:
    image: twake-mail-admin:local
    pull_policy: never
    container_name: twake-mail-functional-admin
    ports:
      - "3334:80"
    volumes:
      - ./twake-mail-admin/functional-admin.env.js:/usr/share/nginx/html/env.js:ro
    networks:
      - tmail

networks:
  tmail:
